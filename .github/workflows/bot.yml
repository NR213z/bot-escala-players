name: "Bot escala Players"

on:
  repository_dispatch:
    types: [telegram-update]
  workflow_dispatch:
    inputs:
      modo:
        description: "remind-hoy | remind-manana | poll (poll solo sirve sin webhook activo)"
        default: "remind-hoy"
        type: choice
        options:
          - remind-hoy
          - remind-manana
          - poll

permissions:
  contents: write

concurrency:
  group: bot-escala-players
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Determinar modo
        id: modo
        run: |
          case "${{ github.event_name }}" in
            repository_dispatch) echo "args=webhook" >> "$GITHUB_OUTPUT" ;;
            *)
              case "${{ github.event.inputs.modo }}" in
                remind-manana) echo "args=remind manana" >> "$GITHUB_OUTPUT" ;;
                poll) echo "args=poll" >> "$GITHUB_OUTPUT" ;;
                *) echo "args=remind hoy" >> "$GITHUB_OUTPUT" ;;
              esac
              ;;
          esac

      - name: Ejecutar
        run: python bot.py ${{ steps.modo.outputs.args }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_UPDATE_JSON: ${{ toJson(github.event.client_payload.update) }}

      - name: Guardar estado
        run: |
          git config user.name "bot-escala-players"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Actualiza estado"
          git push
